---
layout: default
---
<div class="post-shell">

<article class="post h-entry" itemscope itemtype="http://schema.org/BlogPosting">

  <!-- En-tête de l'article -->
  <header class="post-header">
    <a class="back-link" href="{{ '/' | relative_url }}"><span class="arrow">←</span> All articles</a>
    <span class="post-date">{% include date-en.html date=page.date %}</span>
    <h1 class="post-title p-name" itemprop="name headline">{{ page.title | escape }}</h1>
  </header><!-- /post-header -->

  <!-- Corps de l'article -->
  <div class="post-content e-content" itemprop="articleBody">
    {{ content }}
  </div><!-- /post-content -->

  <!-- Retour à l'index -->
  <footer class="post-footer">
    <a class="back-link" href="{{ '/' | relative_url }}"><span class="arrow">←</span> Back to all articles</a>
  </footer><!-- /post-footer -->

</article><!-- /post -->

  <!-- Sommaire latéral (rempli par toc.html, masqué si l'article est court) -->
  <aside class="post-toc" hidden>
    <p class="post-toc-title">On this page</p>
    <ul class="post-toc-list"></ul>
  </aside><!-- /post-toc -->

</div><!-- /post-shell -->

{% include toc.html %}

title: My AI Atlas
tagline: A personal knowledge hub about AI
description: >-
  A personal knowledge hub about AI: a living library of discoveries, thoughts, and learnings about artificial intelligence.
lang: en
theme: minima
show_excerpts: true

# Publie un article dès qu'il est poussé, même si son horodatage exact
# (minuit UTC) n'est pas encore atteint au moment précis de la construction.
future: true

author: Krystel Mata

# Rubriques éditoriales du blog.
# Chaque article choisit la sienne avec « section: explained » ou
# « section: society » dans son en-tête (sans mention : « explained »).
# Clé « section » et non « category » : « category » changerait l'adresse
# des articles déjà publiés.
sections:
  - id: explained
    title: "AI Explained"
    kicker: "Understand the technology"
    description: >-
      What it is, how it works, what it is used for, where it falls short
      and what the evidence says, plus news and new technologies as they
      arrive.
  - id: society
    title: "AI & Society"
    kicker: "Understand the implications"
    description: >-
      Narrative articles that start from real events to explore power,
      ethics, culture and the human consequences of AI.
